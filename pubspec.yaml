name: just_translator
description: "Shiyi Translator (拾译), a focused, cross-platform desktop translator."
publish_to: 'none'
version: 0.3.5+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  dbus: ^0.7.11
  crypto: ^3.0.7
  screen_retriever: ^0.2.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.png
    - assets/tray.ico
