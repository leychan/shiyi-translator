name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*', 'aur/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    name: Analyze and Test
    if: ${{ !startsWith(github.ref, 'refs/tags/aur/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libglib2.0-bin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            artifact: shiyi-translator-linux-x64
          - platform: windows
            os: windows-2022
            artifact: shiyi-translator-windows-x64
          - platform: macos
            os: macos-15
            artifact: shiyi-translator-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev libsecret-1-dev \
            libayatana-appindicator3-dev libarchive-tools zstd dpkg binutils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact }}.tar.gz \
            -C build/linux/x64/release bundle

      - name: Package Debian and Arch installers
        if: runner.os == 'Linux'
        run: python3 tools/package-linux.py

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'dist/${{ matrix.artifact }}.zip'

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo 'Expected exactly one macOS app bundle' >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "${apps[0]}" dist/${{ matrix.artifact }}.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      arch_asset: ${{ steps.publish.outputs.arch_asset }}
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: shiyi-translator-*
          path: dist
          merge-multiple: true

      - name: Publish release packages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            dist/shiyi-translator-linux-x64.tar.gz
            dist/shiyi-translator-windows-x64.zip
            dist/shiyi-translator-macos.zip
          )
          shopt -s nullglob
          deb_packages=(dist/shiyi-translator_*_amd64.deb)
          arch_packages=(dist/shiyi-translator-*-x86_64.pkg.tar.zst)
          if [[ ${#deb_packages[@]} -ne 1 || ${#arch_packages[@]} -ne 1 ]]; then
            echo 'Expected one Debian and one Arch package' >&2
            exit 1
          fi
          packages+=("${deb_packages[@]}")
          arch_package=${arch_packages[0]}
          arch_asset=${arch_package##*/}
          for package in "${packages[@]}" "$arch_package"; do
            if [[ ! -s "$package" ]]; then
              echo "Missing release package: $package" >&2
              exit 1
            fi
          done
          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            # AUR recipes use the checksum of the public Arch asset, so keep it on reruns.
            keep_arch=$(jq -r --arg asset "$arch_asset" \
              '.isDraft == false and any(.assets[]; .name == $asset and .size > 0)' \
              <<< "$release")
            if [[ "$keep_arch" == false ]]; then
              packages+=("$arch_package")
            fi
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" "$arch_package" \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
          echo "arch_asset=$arch_asset" >> "$GITHUB_OUTPUT"

  aur:
    name: Publish to AUR
    if: >-
      ${{ !cancelled() && github.repository == 'leychan/shiyi-translator' &&
          (needs.release.result == 'success' ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/aur/v'))) }}
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: aur-shiyi-translator-bin
      cancel-in-progress: false
    env:
      ARCH_IMAGE: archlinux:base-devel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare AUR package metadata
        env:
          AUR_PACKAGE_DIR: ${{ runner.temp }}/shiyi-aur-package
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH_ASSET: ${{ needs.release.outputs.arch_asset }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # An aur/v* tag reuses a public release without rebuilding it.
          if [[ "$RELEASE_TAG" == aur/* ]]; then
            RELEASE_TAG=${RELEASE_TAG#aur/}
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::Use an AUR publication tag in the form aur/vX.Y.Z.'
              exit 1
            fi
            release=$(gh release view "$RELEASE_TAG" --json isDraft,assets)
            if ! ARCH_ASSET=$(jq -er --arg prefix "shiyi-translator-${RELEASE_TAG#v}-" '
              select(.isDraft == false)
              | [.assets[] | select(.size > 0) | .name
                 | select(startswith($prefix) and endswith("-x86_64.pkg.tar.zst"))]
              | select(length == 1) | .[0]
            ' <<< "$release"); then
              echo "::error::Expected one Arch installer in the public $RELEASE_TAG release."
              exit 1
            fi
          fi

          mkdir -p "$AUR_PACKAGE_DIR"
          archive="$AUR_PACKAGE_DIR/$ARCH_ASSET"
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ARCH_ASSET"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" "$source_url"
          python3 tools/prepare-aur.py "$archive" "$RELEASE_TAG" "$source_url"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$AUR_PACKAGE_DIR:/package" --workdir /package \
            "$ARCH_IMAGE" bash -e -c '
              makepkg --printsrcinfo > .SRCINFO
              makepkg --nodeps --nocolor --nosign
            '

      - name: Push package to AUR
        env:
          AUR_PACKAGE_DIR: ${{ runner.temp }}/shiyi-aur-package
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo '::error::Set the AUR_SSH_PRIVATE_KEY repository secret to publish to AUR.'
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          (umask 077; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$work/key")
          unset AUR_SSH_PRIVATE_KEY

          # Verify the scanned key against the fingerprint published by Arch Linux.
          # https://archlinux.org/news/aur-migration-new-ssh-hostkeys/
          ssh-keyscan -T 10 -t ed25519 aur.archlinux.org > "$work/known_hosts"
          fingerprint=$(ssh-keygen -E sha256 -lf "$work/known_hosts" | awk '{print $2}')
          if [[ "$fingerprint" != 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' ]]; then
            echo '::error::AUR SSH host key does not match the Arch Linux fingerprint.'
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i '$work/key' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$work/known_hosts'"
          git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/shiyi-translator-bin.git "$work/repo"
          cd "$work/repo"

          # An older tag may finish after a newer one. Compare using Arch's version rules.
          package_version() {
            awk '$1 == "epoch" { epoch = $3 ":" }
                 $1 == "pkgver" { version = $3 }
                 $1 == "pkgrel" { release = $3 }
                 END {
                   if (!version || !release) exit 1
                   print epoch version "-" release
                 }' "$1"
          }
          version=$(package_version "$AUR_PACKAGE_DIR/.SRCINFO")
          if [[ -f .SRCINFO ]]; then
            current=$(package_version .SRCINFO)
            comparison=$(docker run --rm "$ARCH_IMAGE" vercmp "$version" "$current")
            if [[ "$comparison" == -1 ]]; then
              echo "AUR already has a newer version ($current)."
              exit 0
            fi
          fi

          cp "$AUR_PACKAGE_DIR/PKGBUILD" "$AUR_PACKAGE_DIR/.SRCINFO" .
          git add -- PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already has this package ($version)."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "发布拾译 $version"
          git push origin HEAD:master
