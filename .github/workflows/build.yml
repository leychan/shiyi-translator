name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    name: Analyze and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libglib2.0-bin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            artifact: shiyi-translator-linux-x64
          - platform: windows
            os: windows-2022
            artifact: shiyi-translator-windows-x64
          - platform: macos
            os: macos-15
            artifact: shiyi-translator-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev libsecret-1-dev \
            libayatana-appindicator3-dev libarchive-tools zstd dpkg binutils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact }}.tar.gz \
            -C build/linux/x64/release bundle

      - name: Package Debian and Arch installers
        if: runner.os == 'Linux'
        run: python3 tools/package-linux.py

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'dist/${{ matrix.artifact }}.zip'

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo 'Expected exactly one macOS app bundle' >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "${apps[0]}" dist/${{ matrix.artifact }}.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: shiyi-translator-*
          path: dist
          merge-multiple: true

      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            dist/shiyi-translator-linux-x64.tar.gz
            dist/shiyi-translator-windows-x64.zip
            dist/shiyi-translator-macos.zip
          )
          shopt -s nullglob
          deb_packages=(dist/shiyi-translator_*_amd64.deb)
          arch_packages=(dist/shiyi-translator-*-x86_64.pkg.tar.zst)
          if [[ ${#deb_packages[@]} -ne 1 || ${#arch_packages[@]} -ne 1 ]]; then
            echo 'Expected one Debian and one Arch package' >&2
            exit 1
          fi
          packages+=("${deb_packages[@]}" "${arch_packages[@]}")
          for package in "${packages[@]}"; do
            if [[ ! -s "$package" ]]; then
              echo "Missing release package: $package" >&2
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
